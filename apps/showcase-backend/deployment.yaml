apiVersion: apps/v1
kind: Deployment
metadata:
  name: showcase-backend
  namespace: showcase
  labels:
    app: showcase-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: showcase-backend
  template:
    metadata:
      labels:
        app: showcase-backend
    spec:
      containers:
        - name: showcase-backend
          image: quay.io/showcase/showcase:cd42f0d1eec8d410494a0167a5a90cf56771e4ae
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: showcase-backend-secrets
                  key: DATABASE_URL
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: showcase-backend-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: showcase-backend-secrets
                  key: AWS_SECRET_ACCESS_KEY
          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: 2500m
              memory: 1024Mi

